<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG 快速拆分工具</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: min(100%, 460px); }
  .drop-zone {
    min-height: 168px;
    display: grid;
    place-items: center;
    padding: 28px 20px;
    border: 2px dashed color-mix(in srgb, CanvasText 35%, transparent);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: Highlight;
    background: color-mix(in srgb, Highlight 8%, Canvas);
  }
  .drop-zone span { font-size: 1rem; }
  .status, .warning {
    margin: 16px 2px 0;
    min-height: 1.5em;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .warning { color: #b45309; }
  @media (prefers-color-scheme: dark) {
    .warning { color: #fbbf24; }
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: Highlight;
    color: HighlightText;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .42; cursor: not-allowed; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<main>
  <label class="drop-zone" id="dropZone" for="fileInput">
    <span>點擊或拖曳 SVG 檔案至此</span>
  </label>
  <input id="fileInput" type="file" accept=".svg,image/svg+xml">
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="warning" id="warning" role="status" aria-live="polite" hidden></p>
  <button id="downloadButton" type="button" disabled>下載 ZIP</button>
</main>

<script>
(() => {
  "use strict";

  const fileInput = document.getElementById("fileInput");
  const dropZone = document.getElementById("dropZone");
  const statusLine = document.getElementById("status");
  const warningLine = document.getElementById("warning");
  const downloadButton = document.getElementById("downloadButton");

  const SHARED = new Set([
    "defs", "style", "metadata", "title", "desc",
    "linearGradient", "radialGradient", "pattern", "clipPath",
    "mask", "filter", "marker", "symbol", "script"
  ]);

  let zipBlob = null;
  let zipName = "svg-split.zip";

  function reset() {
    zipBlob = null;
    downloadButton.disabled = true;
    statusLine.textContent = "";
    warningLine.textContent = "";
    warningLine.hidden = true;
  }

  function isShared(element) {
    return SHARED.has(element.localName);
  }

  function elementChildren(node) {
    return Array.from(node.children || []);
  }

  // 群組至少含有一個非共用資源的後代元素，才視為有效物件。
  function hasGraphicContent(element) {
    for (const child of elementChildren(element)) {
      if (isShared(child)) continue;
      if (child.localName === "g") {
        if (hasGraphicContent(child)) return true;
      } else {
        return true;
      }
    }
    return false;
  }

  function collectObjects(root) {
    const objects = [];
    for (const child of elementChildren(root)) {
      if (isShared(child)) continue;
      if (child.localName === "g") {
        for (const item of elementChildren(child)) {
          if (isShared(item)) continue;
          if (item.localName === "g" && !hasGraphicContent(item)) continue;
          objects.push({ layer: child, node: item });
        }
      } else {
        if (child.localName === "g" && !hasGraphicContent(child)) continue;
        objects.push({ layer: null, node: child });
      }
    }
    return objects;
  }

  function copyWithOnlyObject(originalRoot, target) {
    const root = originalRoot.cloneNode(true);
    const targetIsLayerChild = target.layer !== null;
    const targetNode = target.node;

    if (targetIsLayerChild) {
      const layerIndex = Array.from(originalRoot.children).indexOf(target.layer);
      const clonedLayer = root.children[layerIndex];
      const targetChildIndex = Array.from(target.layer.children).indexOf(targetNode);
      const clonedTarget = clonedLayer.children[targetChildIndex];
      for (const child of elementChildren(clonedLayer)) {
        if (!isShared(child) && child !== clonedTarget) child.remove();
      }
    }

    // 移除根節點下所有非共用資源物件，但保留目標所在圖層外殼。
    const rootChildren = elementChildren(root);
    const originalChildren = elementChildren(originalRoot);
    const targetTopIndex = targetIsLayerChild
      ? originalChildren.indexOf(target.layer)
      : originalChildren.indexOf(targetNode);

    for (let i = rootChildren.length - 1; i >= 0; i--) {
      const originalChild = originalChildren[i];
      if (isShared(originalChild)) continue;
      if (i !== targetTopIndex) rootChildren[i].remove();
    }

    return root;
  }

  function parseInlineStyle(value) {
    const result = new Map();
    for (const declaration of (value || "").split(";")) {
      const colon = declaration.indexOf(":");
      if (colon < 0) continue;
      const name = declaration.slice(0, colon).trim().toLowerCase();
      const val = declaration.slice(colon + 1).trim();
      if (name) result.set(name, val);
    }
    return result;
  }

  function inspectObject(object, root) {
    const found = new Set();
    const nodes = [object.node, ...object.node.querySelectorAll("*")];

    for (const element of nodes) {
      const tag = element.localName;
      if (tag === "text" || tag === "tspan") found.add("文字");
      if (tag === "image") found.add("點陣圖");

      const inline = parseInlineStyle(element.getAttribute("style"));
      for (const property of ["fill", "stroke"]) {
        const value = inline.has(property)
          ? inline.get(property)
          : element.getAttribute(property);
        if (!value) continue;
        const match = value.match(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/i);
        if (!match) continue;
        const referenced = root.querySelectorAll("[id]");
        let resource = null;
        for (const candidate of referenced) {
          if (candidate.getAttribute("id") === match[1]) {
            resource = candidate;
            break;
          }
        }
        if (resource && ["linearGradient", "radialGradient", "pattern"].includes(resource.localName)) {
          found.add("漸層／pattern");
        }
      }

      for (const property of ["filter", "mask", "clip-path"]) {
        if (element.hasAttribute(property) || inline.has(property)) {
          found.add(property === "clip-path" ? "clip-path" : property);
        }
      }
    }
    return found;
  }

  function crc32(bytes) {
    if (!crc32.table) {
      crc32.table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        crc32.table[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (const byte of bytes) {
      crc = crc32.table[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(date) {
    const time = (date.getHours() << 11) |
      (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    const day = ((Math.max(1980, date.getFullYear()) - 1980) << 9) |
      ((date.getMonth() + 1) << 5) | date.getDate();
    return { time, day };
  }

  function makeZip(files) {
    const encoder = new TextEncoder();
    const now = dosDateTime(new Date());
    const localParts = [];
    const centralParts = [];
    let localOffset = 0;

    for (const file of files) {
      const name = encoder.encode(file.name);
      const data = file.bytes;
      const crc = crc32(data);

      const local = new Uint8Array(30 + name.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, now.time, true);
      lv.setUint16(12, now.day, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      local.set(name, 30);
      localParts.push(local, data);

      const central = new Uint8Array(46 + name.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, now.time, true);
      cv.setUint16(14, now.day, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, localOffset, true);
      central.set(name, 46);
      centralParts.push(central);

      localOffset += local.length + data.length;
    }

    const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, localOffset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
  }

  async function processFile(file) {
    reset();
    if (!file) return;

    try {
      const text = await file.text();
      const parsed = new DOMParser().parseFromString(text, "image/svg+xml");
      if (parsed.querySelector("parsererror") || !parsed.documentElement ||
          parsed.documentElement.localName !== "svg") {
        statusLine.textContent = "檔案無法解析，請確認是有效的 SVG";
        return;
      }

      const root = parsed.documentElement;
      const objects = collectObjects(root);
      if (objects.length === 0) {
        statusLine.textContent = "找不到可拆分的物件";
        return;
      }

      const serializer = new XMLSerializer();
      const encoder = new TextEncoder();
      const outputFiles = [];
      const warningObjects = [];
      const warningTypes = new Set();

      objects.forEach((object, index) => {
        const number = index + 1;
        const issues = inspectObject(object, root);
        if (issues.size) {
          warningObjects.push(number);
          issues.forEach(issue => warningTypes.add(issue));
        }

        const outputRoot = copyWithOnlyObject(root, object);
        const svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' +
          serializer.serializeToString(outputRoot);
        outputFiles.push({ name: `${number}.svg`, bytes: encoder.encode(svgText) });
      });

      zipBlob = makeZip(outputFiles);
      const originalName = file.name ? file.name.replace(/\.svg$/i, "") : "";
      zipName = `${originalName || "svg-split"}.zip`;
      statusLine.textContent = `偵測到 ${objects.length} 個物件`;

      if (warningObjects.length) {
        const typeText = Array.from(warningTypes).join("／");
        warningLine.textContent =
          `第 ${warningObjects.join("、")} 個物件含 Tinkercad 不支援的內容（${typeText}），請先在 Inkscape 轉成路徑。`;
        warningLine.hidden = false;
      }

      downloadButton.disabled = false;
    } catch (error) {
      reset();
      statusLine.textContent = "檔案無法解析，請確認是有效的 SVG";
    }
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files.length) processFile(fileInput.files[0]);
  });

  downloadButton.addEventListener("click", () => {
    if (!zipBlob) return;
    const url = URL.createObjectURL(zipBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = zipName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  ["dragenter", "dragover"].forEach(type => {
    dropZone.addEventListener(type, event => {
      event.preventDefault();
      dropZone.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(type => {
    dropZone.addEventListener(type, event => {
      event.preventDefault();
      dropZone.classList.remove("dragover");
    });
  });
  dropZone.addEventListener("drop", event => {
    const files = event.dataTransfer && event.dataTransfer.files;
    if (files && files.length) {
      fileInput.value = "";
      processFile(files[0]);
    }
  });
})();
</script>
</body>
</html>
